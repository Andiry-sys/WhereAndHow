<div class="outer">
  <div class="container">
    <div class="row">
      <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
        <div class="panel border bg-dark">
          <div class="panel-heading">
            <h3 class="pt-3 font-weight-bold">Оновити дані</h3>
          </div>
          <div *ngIf="user" class="panel-body p-3">
            <form>
              <div class="form-group pt-3">
                <div class="input-field">
                  <span aria-hidden="true"></span>
                  <input
                    placeholder="Ім'я"
                    type="text"
                    id="name"
                    name="name"
                    [(ngModel)]="user.name"
                    required
                  />
                </div>
              </div>
              <div class="form-group pt-3">
                <div class="input-field">
                  <input
                    placeholder="Прізвище"
                    type="text"
                    id="secondName"
                    name="sureName"
                    [ngModel]="user.sureName"
                    required
                  />
                </div>
              </div>
              <div class="form-group pt-3">
                <div class="input-field">
                  <input
                    placeholder="Електронна пошта"
                    type="email"
                    id="email"
                    name="email"
                    [ngModel]="user.email"
                    required
                  />
                </div>
              </div>
              <div class="form-group pt-3">
                <div class="input-field">
                  <input
                    placeholder="Пароль"
                    type="text"
                    id="password"
                    name="password"
                    [ngModel]="user.password"
                    required
                  />
                </div>
              </div>
              <div class="form-group pt-3">
                <div class="input-field">
                  <input
                    placeholder="Номер телефону"
                    type="tel"
                    id="phoneNumber"
                    name="phoneNumber"
                    [ngModel]="user.phoneNumber"
                    required
                  />
                </div>
              </div>
              <div class="form-group pt-3">
                <input
                  type="checkbox"
                  id="isLosser"
                  name="isLosser"
                  [(ngModel)]="user.isLosser"
                />
                <span class="partner">Хочете бути партнером</span>
              </div>
              <button
                (click)="onSubmit()"
                type="submit"
                class="btn btn-primary btn-block mt-4 w-100"
              >
                Зберегти зміни
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
